  },

  async requirements(id, file) {
    if (id === 'files') return views.reqFiles(file);
    if (id) return views.requirement(id);
    const d = await api('/api/requirements');
    S.reqs = d.rows;
    const counts = { all: d.rows.length };
    for (const r of d.rows) counts[r.status] = (counts[r.status] || 0) + 1;
    const rows = d.rows.filter((r) => reqFilter === 'all' || r.status === reqFilter);
    const filters = ['all', ...ORDER].filter((f) => counts[f]).map((f) => `<button type="button" data-action="req-filter" data-f="${f}" aria-pressed="${reqFilter === f}">${f === 'all' ? 'All' : STATUS[f][0]} <span class="n">${counts[f]}</span></button>`).join('');
    const head = page({
      title: 'Requirements',
      desc: 'Each requirement traced to its acceptance criteria, tests, results and bugs. Requirements come from your documents in any format.',
      actions: btn('import', 'Re-import', '', '', 'import') + btn('map', 'Map to pages', '', '', 'link') + btn('upload', 'Upload document', '', '', 'upload') + btn('jira-import', 'Import from Jira…', '', '', 'external') + btn('generate', 'Write tests for gaps', '', 'primary', 'sparkle') + '<input id="uploadDoc" type="file" accept=".docx,.pdf,.txt,.md,.markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown" hidden aria-label="Requirement document to upload">',
      tabs: tabs([['list', '#/requirements', 'All requirements'], ['files', '#/requirements/files', 'Requirement files']], 'list'),
    });
    if (!d.rows.length) return head + card({ body: emptyState('requirements', 'No requirements yet', 'Add requirements in any format: upload a Word, PDF or text document, import stories from Jira, or just write them. No special format is needed. No requirements at all? Explore the app instead.', btn('upload', 'Upload Word or PDF', '', 'primary', 'upload') + btn('jira-import', 'Import from Jira…', '', '', 'external') + linkBtn('#/requirements/files/new', 'Write a file', '', 'plus') + btn('explore-app', 'Explore without requirements', '', '', 'sparkle')) });
    return head + `<div class="toolbar"><div class="segmented" role="group" aria-label="Filter by status">${filters}</div><div style="flex:0 1 320px;display:flex">${searchBox('req', '#reqTable tbody tr', 'Search ID or title', '#reqNoMatch')}</div></div>` +
      card({ flush: true, body: `<div class="table-wrap"><table class="data" id="reqTable"><thead><tr><th>ID</th><th>Requirement</th><th>Criteria tested</th><th class="num">Tests</th><th>Status</th><th>Bugs</th></tr></thead><tbody>
        ${rows.map((r) => `<tr class="click" data-href="#/requirements/${enc(r.requirementId)}" data-search="${esc((r.requirementId + ' ' + r.title + ' ' + r.feature).toLowerCase())}"><td class="nowrap"><a class="mono" href="#/requirements/${enc(r.requirementId)}">${esc(r.requirementId)}</a></td><td><div class="cell-title">${esc(r.title)}</div><div class="cell-sub">${esc(r.feature)}${r.issues.length ? ` · <span style="color:var(--warn)">${plural(r.issues.length, 'issue')}</span>` : ''}</div></td><td class="nowrap">${r.criteria.filter((c) => c.tests).length} of ${r.criteria.length}</td><td class="num">${r.tests}</td><td>${chip(STATUS, r.status)}</td><td>${r.bugs.map((b) => `<a class="mono" href="#/bugs/${enc(b)}">${esc(b)}</a>`).join(', ') || '<span class="muted">—</span>'}</td></tr>`).join('')}
        </tbody></table></div><p class="empty" id="reqNoMatch" style="padding:16px 20px" hidden>No requirements match.</p>` });
  },

  async reqFiles(file) {
    const d = await api('/api/requirement-files');
    const isNew = file === 'new' || (!file && !d.files.length);
    const current = isNew ? null : d.files.find((f) => f.file === file) || d.files[0];
    const meta = current ? await api(`/api/requirement-files/content?file=${enc(current.file)}`) : null;
    const ORIGIN = { jira: ['Jira sync', 'tag'], discovered: ['Discovered', 'tag'] };
    const originTag = (o) => (ORIGIN[o] ? `<span class="${ORIGIN[o][1]}">${ORIGIN[o][0]}</span> ` : '');
    const items = d.files.map((f) => listItem(`#/requirements/files/${enc(f.file)}`, !!current && f.file === current.file, `${icon(DOC_TYPE_ICON[f.type] || 'file', 14)} <span class="mono">${esc(f.file)}</span>`, '', `<span class="tag">${esc(f.type)}</span> ${originTag(f.origin)}${f.mode === 'ai' ? modeTag('ai') + ' ' : ''}${plural(f.requirements, 'requirement')} · ${plural(f.criteria, 'criterion').replace('criterions', 'criteria')}`)).join('');
    const head = page({
      title: 'Requirements',
      desc: `Your requirement documents in <code>${esc(d.dir)}/</code>, in any format: Markdown, text, Word or PDF, written however you like. TraceQA reads them as they are; nothing is converted or rewritten.`,
      actions: btn('upload', 'Upload document', '', '', 'upload') + btn('jira-import', 'Import from Jira…', '', '', 'external') + linkBtn('#/requirements/files/new', 'New file', 'primary', 'plus') + '<input id="uploadDoc" type="file" accept=".docx,.pdf,.txt,.md,.markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown" hidden aria-label="Requirement document to upload">',
      tabs: tabs([['list', '#/requirements', 'All requirements'], ['files', '#/requirements/files', 'Requirement files']], 'files'),
    });
    const doc = meta && meta.document;
    const readingNote = () => {
      if (!doc) return '';
      const aiBtn = btn('read-doc', doc.mode === 'ai' ? 'Read again with AI…' : 'Read with AI…', `data-file="${esc(current.file)}"`, 'sm', 'sparkle');
      if (doc.reading && doc.reading.stale) return callout('warn', `The document changed since ${esc(doc.reading.by)} read it, so TraceQA is reading it automatically again.<div class="form-actions" style="margin-top:10px">${aiBtn}</div>`);
      if (doc.mode === 'ai') return callout('ok', `${READ_MODE.ai[2]} Read by ${esc(doc.reading.by)} on ${when(doc.reading.at)}.<div class="form-actions" style="margin-top:10px">${aiBtn}${btn('forget-reading', 'Use automatic reading', `data-file="${esc(current.file)}"`, 'sm ghost', 'refresh')}</div>`);
      const few = !doc.requirements || !doc.criteria;
      return callout(few ? 'warn' : 'info', `${few ? '<b>Little was found automatically.</b> ' : ''}${READ_MODE[doc.mode] ? READ_MODE[doc.mode][2] : ''}${doc.mode === 'free-form' ? ' If it missed or misread something, read it with AI; the document stays as it is.' : ''}<div class="form-actions" style="margin-top:10px">${aiBtn}</div>`);
    };
    const originNote = meta && meta.origin === 'jira'
      ? callout('info', `Synced from Jira. This file is replaced on every sync, so change requirements in Jira.<div class="form-actions" style="margin-top:10px">${btn('jira-import', 'Sync again…', '', 'sm', 'refresh')}</div>`)
      : meta && meta.origin === 'discovered' ? callout('info', 'Flows the AI found while exploring without requirements. They describe what the app does today: confirm each one with the team, and edit it where the intended behaviour differs.') : '';

    if (meta && meta.binary) {
      // Word and PDF: shown as read, not edited here.
      const docCard = card({
        title: `${icon('file', 16)} <span class="mono">${esc(current.file)}</span>`,
        sub: `${esc(doc.type)} document · ${(doc.size / 1024).toFixed(doc.size < 10240 ? 1 : 0)} KB · updated ${when(doc.updatedAt)} · ${modeTag(doc.mode)}`,
        actions: btn('reqfile-delete', 'Move to trash', `data-file="${esc(current.file)}"`, 'sm ghost danger', 'trash'),
        body: `<p class="muted">Edit it in Word or your PDF tool, then upload it again; TraceQA keeps reading the version in the requirements folder.${doc.warnings.length ? '' : ''}</p>${doc.warnings.map((w) => `<div style="margin-top:10px">${callout('warn', esc(w))}</div>`).join('')}`,
      });
      return head + split('Files', d.files.length, items, `${readingNote()}${docCard}${card({ title: `What TraceQA understood <span class="badge">${meta.requirements.length}</span>`, flush: true, body: understoodList(meta.requirements) })}`);
    }

    const content = meta ? meta.content : REQ_TEMPLATE;
    const editor = card({
      title: current ? `<span class="mono">${esc(current.file)}</span>` : 'New requirement file',
      sub: 'Write requirements any way you like: headings, user stories, bullet lists, tables or plain sentences. IDs are optional; TraceQA assigns them.',
      body: `<form data-form="reqfile" class="stack" data-previous="${esc(current ? current.file : '')}" id="reqForm">
        ${field({ label: 'File name', name: 'file', value: current ? current.file : 'new-requirements.md', required: true, mono: true, attrs: 'title="A name ending in .md or .txt"' })}
        ${textareaField({ label: 'Content', name: 'content', value: content, mono: true, id: 'reqEditor', attrs: 'spellcheck="true"' }).replace('class="input mono"', 'class="input mono editor"')}
      </form>`,
      foot: `<button class="btn primary" type="submit" form="reqForm">${icon('check')}<span>Save and import</span></button>${current ? btn('read-doc', 'Read with AI…', `data-file="${esc(current.file)}"`, '', 'sparkle') + btn('reqfile-delete', 'Move to trash', `data-file="${esc(current.file)}"`, 'danger', 'trash') : ''}`,
    });
    return head + split('Files', d.files.length, items, `${originNote}${current && doc && (doc.mode === 'ai' || (doc.reading && doc.reading.stale)) ? readingNote() : ''}<div class="cols-editor">${editor}${card({ title: 'What TraceQA understood', sub: '<span id="reqMode">Updates as you type.</span>', flush: true, body: '<div id="reqPreview" style="padding:16px 20px" class="empty">Reading…</div>' })}</div>`);
  },

  async requirement(id) {
    const d = await api(`/api/requirements/${enc(id)}`);
    const r = d.requirement, c = d.coverage;
    const crit = r.criteria.map((ac) => {
      const cc = c.criteria.find((x) => x.acId === ac.id) || { tests: 0, passed: 0, failed: 0 };
      const vague = ac.issues.some((i) => i.kind === 'vague');
      return `<div class="ac ${cc.failed ? 'bad' : ''}"><span class="id">${esc(ac.id)}</span><span class="txt">${esc(ac.text)}${ac.clarified ? ' <span class="tag">clarified</span>' : ''}</span>
        <span class="stat-line">${plural(cc.tests, 'test')} · ${cc.passed} passed · ${cc.failed} failed</span>
        <div class="extra">${ac.issues.map((i) => callout('warn', esc(i.message))).join('')}
        <details class="clarify" ${vague ? 'open' : ''}><summary>${icon('edit', 14)} ${vague ? 'Agree a testable wording' : 'Clarify the wording'}</summary><form class="inline-form" data-form="clarify" data-req="${esc(r.id)}" data-ac="${esc(ac.id)}"><input class="input" name="text" aria-label="New wording for ${esc(ac.id)}" placeholder="e.g. Results appear within 2 seconds" required><button class="btn" type="submit">Save wording</button></form></details></div></div>`;
    }).join('');
    const tests = d.tests.map((t) => `<div class="row-item"><div class="row-line"><div class="grow"><div class="row-title">${t.acId ? `<span class="tag mono">${esc(t.acId)}</span> ` : ''}${esc(t.title)}</div><div class="row-meta">${t.last ? chip(RESULT, t.last.status) : '<span class="chip">Not run</span>'}${t.signedIn ? '<span class="tag">signed in</span>' : ''}</div></div><div class="actions">${btn('run-test', 'Run', `data-test="${esc(t.id)}"`, 'sm', 'play')}${btn('remove-test', 'Remove', `data-test="${esc(t.id)}"`, 'sm ghost danger', 'trash')}</div></div><ol class="steps-list">${t.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div>`).join('');
    return page({
      title: r.title,
      meta: `<span class="tag mono">${esc(r.id)}</span>${chip(STATUS, c.status)}<span>${esc(r.feature)}</span><span>·</span><a href="#/requirements/files/${enc(d.sourceFile)}">${icon('file', 14)} ${esc(r.source.file)}${r.source.line ? `:${r.source.line}` : ''}</a>${r.source.section && r.source.section !== r.title ? `<span>·</span><span>${esc(r.source.section)}</span>` : ''}${r.autoId ? '<span class="tag" title="The document gives no ID, so TraceQA assigned one. It stays the same while the section title is unchanged.">ID assigned</span>' : ''}${r.source.mode === 'ai' ? '<span class="tag ai">Read by AI</span>' : ''}${d.jiraUrl ? `<span>·</span><a href="${esc(d.jiraUrl)}" target="_blank" rel="noopener">${icon('external', 14)} Open in Jira</a>` : ''}${d.origin === 'discovered' ? '<span class="tag">Discovered</span>' : d.origin === 'ai' ? '<span class="tag ai">AI converted</span>' : ''}`,
      actions: btn('explore', 'Explore with AI', `data-req="${esc(r.id)}"`, '', 'sparkle') + btn('generate', 'Write tests with AI', `data-req="${esc(r.id)}"`, '', 'sparkle') + btn('run-req', 'Run tests', `data-req="${esc(r.id)}"`, 'primary', 'play'),
    }) + (d.origin === 'discovered' ? callout('info', 'Found while exploring without requirements: it describes what the app does today. Confirm it with the team, and edit the file where the intended behaviour differs.') : d.origin === 'ai' ? callout('warn', 'Written by AI from a document. Check it against the original before relying on it.') : '') + `<div class="cols"><div class="stack-lg">
        ${card({ title: 'Acceptance criteria', sub: r.description ? esc(r.description) : '', flush: true, body: crit || `<div style="padding:16px 20px" class="empty">No acceptance criteria. Add bullets under the heading in the requirement file.</div>` })}
        ${card({ title: `Tests <span class="badge">${d.tests.length}</span>`, sub: d.specFile ? `<a class="mono" href="#/tests/${enc(r.id)}">${esc(d.specFile)}</a>` : '', flush: true, body: tests ? `<div class="rows">${tests}</div>` : emptyState('tests', 'No tests yet', 'Let the AI agent write one per acceptance criterion, or ask your AI coding tool.', btn('generate', 'Write tests with AI', `data-req="${esc(r.id)}"`, 'primary', 'sparkle')) })}
      </div><div class="stack-lg">
        ${card({ title: 'Coverage', body: `<dl class="dl"><dt>Status</dt><dd>${chip(STATUS, c.status)}</dd><dt>Criteria tested</dt><dd>${c.criteria.filter((x) => x.tests).length} of ${c.criteria.length}</dd><dt>Tests</dt><dd>${c.tests}</dd><dt>Feature</dt><dd>${esc(r.feature)}</dd></dl>` })}
        ${card({ title: 'Mapped pages', actions: btn('map', 'Re-map', '', 'sm ghost', 'refresh'), body: d.pages.length ? `<div class="chips">${d.pages.map((p) => `<a class="tag mono" href="#/appmap/${enc(p.pageId)}">${esc(p.page || p.pageId)}</a>`).join('')}</div>` : '<p class="empty">No pages matched yet.</p>' })}
        ${card({ title: 'Bugs', flush: true, body: d.bugs.length ? `<ul class="plain">${d.bugs.map((b) => `<li><div class="row-line"><a class="mono" href="#/bugs/${enc(b.id)}">${esc(b.id)}</a>${chip(BUG, b.status)}</div><div class="cell-sub">${esc(b.title)}</div></li>`).join('')}</ul>` : '<div style="padding:16px 20px" class="empty">No bugs.</div>' })}
      </div></div>`;
  },

  async appmap(id) {
    const d = await api('/api/appmap');
    const head = page({ title: 'App map', desc: `${plural(d.pages.length, 'page')} TraceQA knows${d.updatedAt ? `, updated ${when(d.updatedAt)}` : ''}. Page objects in the framework come from here.`, actions: btn('map', 'Map requirements', '', '', 'link') + btn('job', d.pages.length ? 'Re-analyze app' : 'Analyze app', 'data-kind="analyze"', 'primary', 'refresh') });
    if (!d.pages.length) return head + card({ body: emptyState('appmap', 'The app map is empty', 'Analyze the app: TraceQA crawls it from the app address and records each page with stable locators.', btn('job', 'Analyze app', 'data-kind="analyze"', 'primary', 'refresh')) });
    const page_ = d.pages.find((p) => p.id === id) || d.pages[0];
    const items = d.pages.map((p) => listItem(`#/appmap/${enc(p.id)}`, p.id === page_.id, esc(p.name), `<span class="muted small">${p.elements.length}</span>`, `<span class="mono">${esc(p.templatePath)}</span>${p.requirements.length ? ' · ' + esc(p.requirements.join(', ')) : ' · <span style="color:var(--warn)">no requirement</span>'}`)).join('');
    const detail = card({
      title: esc(page_.name),
      sub: `<span class="mono">${esc(page_.templatePath)}</span> · <span class="mono">${esc(page_.className)}</span>`,
      body: `<dl class="dl" style="margin-bottom:16px"><dt>Updated</dt><dd>${when(page_.updatedAt)} · from ${esc(page_.source)}</dd><dt>Forms</dt><dd>${page_.forms}</dd><dt>Headings</dt><dd>${esc(page_.headings.join(' | ')) || '—'}</dd><dt>Requirements</dt><dd>${page_.requirements.length ? page_.requirements.map((r) => `<a class="mono" href="#/requirements/${enc(r)}">${esc(r)}</a>`).join(', ') : '<span style="color:var(--warn)">None</span>'}</dd></dl>
        <div class="table-wrap" style="margin:0 -20px -18px;border-top:1px solid var(--border-2)"><table class="data"><thead><tr><th>Key</th><th>Element</th><th>Locator</th><th>Stability</th></tr></thead><tbody>
        ${page_.elements.map((e) => `<tr><td class="mono nowrap">${esc(e.key)}</td><td>${esc(e.role)} <span class="muted">“${esc(e.name)}”</span></td><td class="mono small">${esc(locatorCode(e.locator))}</td><td>${chip(STABILITY, e.stability)}</td></tr>`).join('')}
        </tbody></table></div>`,
    });
    return head + split('Pages', d.pages.length, items, detail);
  },

  async sessions(id) {
    const d = await api('/api/sessions');
    const head = page({ title: 'Explorer', desc: 'Exploration sessions run by the AI agent or your AI coding tool, with every step screenshotted. Explore one requirement, or the whole app without any requirements.', actions: btn('explore', 'Explore a requirement…', '', '', 'requirements') + btn('explore-app', 'Explore the app…', '', 'primary', 'sparkle') });
    if (!d.sessions.length) return head + card({ body: emptyState('sessions', 'No sessions yet', 'Explore the whole app to find bugs and automate its main flows, no requirements needed. Or explore one requirement against its acceptance criteria.', btn('explore-app', 'Explore the app…', '', 'primary', 'sparkle') + btn('explore', 'Explore a requirement…', '', '', 'requirements')) });
    const s = d.sessions.find((x) => x.id === id) || d.sessions[0];
    await refreshJobs();
    const driver = s.live ? S.jobs.find((jb) => jb.sessionId === s.id && jb.status === 'running') : null;
    const items = d.sessions.map((x) => listItem(`#/sessions/${enc(x.id)}`, x.id === s.id, `${esc(x.id)} · ${x.requirementId ? esc(x.requirementId) : 'Whole app'}`,
      x.live ? '<span class="chip"><span class="dot pulse" style="background:var(--failing)"></span>Live</span>' : x.findings.length ? `<span class="chip"><span class="dot" style="background:var(--failing)"></span>${x.findings.length}</span>` : '',
      `${esc(x.charter)}<br>${plural(x.steps.length, 'step')} · ${plural(x.findings.length, 'problem')} · ${when(x.startedAt)}`)).join('');
    const failedSteps = s.steps.filter((st) => !st.ok).length;
    const findingsAfter = (n) => s.findings.filter((f) => f.afterStep === n);
    const offset = (iso) => { const sec = Math.max(0, Math.round((new Date(iso) - new Date(s.startedAt)) / 1000)); return `+${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
    const stat = (label, value, hl = false) => `<div class="stat${hl ? ' hl' : ''}"><div class="label">${label}</div><div class="value">${value}</div></div>`;

    const live = driver && driver.progress
      ? callout('info', `<b>${esc(driver.progress.phaseLabel || 'Working')}</b> · ${esc(driver.progress.activity)} <a href="#/jobs/${enc(driver.id)}">Watch the job</a>`, 'sparkle')
      : '';
    const overviewCard = card({
      title: `${esc(s.id)} · ${s.requirementId ? `<a href="#/requirements/${enc(s.requirementId)}">${esc(s.requirementId)}</a>` : 'Whole app'}${s.live ? ' <span class="chip"><span class="dot pulse" style="background:var(--failing)"></span>Live</span>' : ''}`,
      sub: esc(s.charter),
      body: `<div class="stack">
        <div class="stats">${stat('Steps', s.steps.length)}${stat('Failed steps', failedSteps, failedSteps > 0)}${stat('Pages', s.pages.length)}${stat('Problems found', s.findings.length, s.findings.length > 0)}${stat('Console errors', s.consoleErrors.length, s.consoleErrors.length > 0)}${stat('Failed requests', s.failedRequests.length, s.failedRequests.length > 0)}</div>
        <dl class="dl"><dt>Started</dt><dd>${when(s.startedAt)}</dd><dt>Duration</dt><dd>${dur(s.startedAt, s.endedAt)}${s.live ? ' so far' : ''}</dd>${s.pages.length ? `<dt>Pages visited</dt><dd><div class="chips">${s.pages.map((pg) => `<span class="tag mono">${esc(pg)}</span>`).join('')}</div></dd>` : ''}</dl></div>`,
    });
    const findings = s.findings.map((f) => `<li><div class="row-line"><div class="grow"><div class="row-title">${esc(f.title)}</div><div class="row-meta">${chip(SEVERITY, f.severity)}<a class="mono" href="#/bugs/${enc(f.bugId)}">${esc(f.bugId)}</a>${f.afterStep ? `<a href="#" data-action="goto-step" data-n="${f.afterStep}">after step ${f.afterStep}</a>` : ''}${f.category ? `<span class="tag">${esc(f.category)}</span>` : ''}</div></div>
      ${f.screenshot ? `<div style="width:180px">${shotBtn(f.screenshot, `${f.bugId}: ${f.title}`, `find-${s.id}`, 'thumb')}</div>` : ''}</div>
      <div class="ea" style="margin-top:10px"><div><span class="k">Expected</span>${esc(f.expected)}</div><div class="bad"><span class="k">Actual</span>${esc(f.actual)}</div></div></li>`).join('');
    const steps = s.steps.map((st) => {
      const found = findingsAfter(st.n);
      let pathText = st.url;
      try { const u = new URL(st.url); pathText = u.pathname + u.search; } catch {}
      return `<li id="step-${st.n}" class="${st.ok ? '' : 'bad'}${found.length ? ' finding' : ''}"><span class="n" aria-label="Step ${st.n}${st.ok ? '' : ', failed'}">${st.n}</span>
        <div><div class="s-t"><span class="act">${esc(String(st.action).replace('_', ' '))}</span> ${esc(String(st.detail || '').replace(new RegExp(`^${String(st.action).replace('_', ' ')}\\s*`, 'i'), '') || '—')}</div>
          <div class="s-m"><span class="mono">${esc(pathText)}</span><span>${offset(st.at)}</span>${st.ok ? '' : '<span style="color:var(--danger);font-weight:600">Failed</span>'}</div>
          ${st.error ? `<div class="s-err">${esc(st.error)}</div>` : ''}
          ${found.map((f) => `<div class="s-find">${icon('bugs', 13)} Problem recorded: <b>${esc(f.title)}</b> → <a class="mono" href="#/bugs/${enc(f.bugId)}">${esc(f.bugId)}</a></div>`).join('')}</div>
        ${st.screenshot ? shotBtn(st.screenshot, `Step ${st.n}: ${st.detail}`, `steps-${s.id}`) : '<span></span>'}</li>`;
    }).join('');
    const stepFilter = s.steps.length > 8 ? `<div class="segmented" role="group" aria-label="Show steps">${[['all', 'All steps'], ['bad', 'Failed and problems']].map(([f, l]) => `<button type="button" data-action="step-filter" data-f="${f}" aria-pressed="${(S.stepFilter || 'all') === f}">${l}</button>`).join('')}</div>` : '';
    const technical = s.consoleErrors.length || s.failedRequests.length || (s.blockedNavigation || []).length
      ? card({ title: 'Console errors and failed requests', sub: 'Collected from the browser while exploring.', flush: true, body: `
          ${s.consoleErrors.length ? `<details ${s.consoleErrors.length <= 5 ? 'open' : ''}><summary style="padding:10px 20px;cursor:pointer;font-weight:600">Console errors (${s.consoleErrors.length})</summary><ul class="mini-list">${s.consoleErrors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
          ${s.failedRequests.length ? `<details ${s.failedRequests.length <= 5 ? 'open' : ''}><summary style="padding:10px 20px;cursor:pointer;font-weight:600">Failed requests (${s.failedRequests.length})</summary><ul class="mini-list">${s.failedRequests.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
          ${(s.blockedNavigation || []).length ? `<details><summary style="padding:10px 20px;cursor:pointer;font-weight:600">Blocked by the safety rules (${s.blockedNavigation.length})</summary><ul class="mini-list">${s.blockedNavigation.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}` })
      : '';
    return head + split('Sessions', d.sessions.length, items, `
      ${live}${overviewCard}
      ${card({ title: `Problems found <span class="badge">${s.findings.length}</span>`, sub: s.findings.length ? 'Each one is a draft bug with a screenshot. Nothing is filed until you decide.' : '', flush: true, body: findings ? `<ul class="plain">${findings}</ul>` : `<div style="padding:16px 20px" class="empty">${s.live ? 'None so far.' : 'No problems found.'}</div>` })}
      ${card({ title: `Steps <span class="badge">${s.steps.length}</span>`, sub: 'What the browser did, in order. Click a screenshot to enlarge it.', actions: stepFilter, flush: true, body: steps ? `<ol class="stepline" id="stepline" data-f="${esc(S.stepFilter || 'all')}">${steps}</ol>` : `<div style="padding:16px 20px" class="empty">${s.live ? 'Waiting for the first step…' : 'No steps.'}</div>` })}
      ${technical}`);
  },

  /** Tests, grouped by requirement (default) or as one list of every test (#/tests/all). */
  async tests(id, sub) {
    const d = await api('/api/tests');
    if (id === 'all') return views.testsAll(d, sub);
    const head = testsHead(d, 'req', d.groups.length ? '' : btn('run-dialog', 'Run tests…', '', 'primary', 'play'));
    if (!d.groups.length) {
      if (d.all.length) return head + card({ body: emptyState('tests', 'No tests are linked to a requirement yet', `The framework has ${plural(d.all.length, 'test')}, but none is linked to a requirement. Tests TraceQA writes are always linked; hand-written tests are linked by a tag in their title, such as <code>@REQ-142</code>.`, linkBtn('#/tests/all', 'See all tests', 'primary', 'tests')) });
      return head + card({ body: emptyState('tests', 'No tests saved yet', `${d.installed ? '' : 'Create the framework first, then '}write tests with AI or from your AI coding tool.`, d.installed ? btn('generate', 'Write tests with AI', '', 'primary', 'sparkle') : btn('job', 'Create framework', 'data-kind="scaffold"', 'primary', 'refresh')) });
    }
    const g = d.groups.find((x) => x.requirementId === (id || '').toUpperCase()) || d.groups[0];
    const spec = await api(`/api/spec?req=${enc(g.requirementId)}`);
    S.spec = spec;
    const items = d.groups.map((x) => {
      const c = tally(x.tests);
      const dotColor = c.failed ? 'var(--failing)' : c.passed === x.tests.length ? 'var(--covered)' : 'var(--notrun)';
      return listItem(`#/tests/${enc(x.requirementId)}`, x.requirementId === g.requirementId, `<span class="mono">${esc(x.requirementId)}</span>`,
        `<span class="chip" title="${c.passed} passed, ${c.failed} failed, ${c.other} not run"><span class="dot" style="background:${dotColor}"></span>${c.passed}/${x.tests.length}</span>`, esc(x.title));
    }).join('') + (d.unlinked ? listItem('#/tests/all/unlinked', false, 'Not linked to a requirement', `<span class="chip">${d.unlinked}</span>`, 'Tests without a requirement, in the All tests list') : '');
    const c = tally(g.tests);
    const rows = g.tests.map((t) => {
      const st = statusOf(t);
      const l = t.latest;
      const range = (spec.tests || []).find((r) => r.id === t.id);
      const hand = t.source === 'hand-written';
      return `<div class="row-item" id="test-${esc(t.key)}">
        <div class="row-line"><div class="grow">
          <div class="row-title">${t.acId ? `<span class="tag mono">${esc(t.acId)}</span> ` : ''}${esc(hand ? t.title.replace(/^AC\d+\s*·?\s*/, '') : t.title)}</div>
          ${t.criterion ? `<div class="crit">Proves: ${esc(t.criterion)}</div>` : ''}
          <div class="row-meta" style="margin-top:6px">${statusChip(t)}${l && l.verdict ? `<span class="tag" title="${esc(VERDICT[l.verdict] || '')}">${esc(l.verdict)}</span>` : ''}${l && l.project ? `<span class="tag">${esc(l.project)}${l.browsers > 1 ? ` +${l.browsers - 1}` : ''}</span>` : ''}${l && l.durationMs ? `<span>${(l.durationMs / 1000).toFixed(1)} s</span>` : ''}${t.signedIn ? '<span class="tag">signed in</span>' : ''}${hand ? `<span class="tag">Hand-written</span><span class="mono small">${esc(t.file)}:${t.line}</span>` : `<span class="mono small">${esc(t.id)}</span>`}</div>
        </div><div class="actions">${runBtn(t)}${range ? btn('show-code', 'Code', `data-from="${range.start}" data-to="${range.end}"`, 'sm', 'code') : ''}${hand ? '' : btn('remove-test', 'Remove', `data-test="${esc(t.id)}"`, 'sm ghost danger', 'trash')}</div></div>
        ${hand ? '' : stepsList(t)}
        ${failure(t)}
        ${hand && t.code ? `<details><summary class="small" style="cursor:pointer;color:var(--accent-ink)">Show its code</summary><div style="margin-top:8px">${codeView(t.code, `code-${t.key.replace(/[^\w-]/g, '-')}`, null, t.line)}</div></details>` : ''}
      </div>`;
    }).join('');
    const codeCard = card({
      title: 'Spec file',
      sub: `<span class="mono">${esc(spec.file)}</span> · plain Playwright, runs with <code>npx playwright test</code>`,
      actions: spec.code ? btn('copy-code', 'Copy', '', 'sm ghost', 'copy') : '',
      id: 'specCard',
      body: spec.code ? codeView(spec.code, 'specCode') : '<p class="empty">Not rendered yet. Click “Re-render code”.</p>',
    });
    return testsHead(d, 'req', btn('run-req', `Run ${g.requirementId}`, `data-req="${esc(g.requirementId)}"`, 'primary', 'play')) + split('Requirements', d.groups.length, items, `
      ${card({ title: `<a href="#/requirements/${enc(g.requirementId)}">${esc(g.requirementId)}</a> · ${esc(g.title)}`, sub: `${esc(g.feature || '')}${g.feature ? ' · ' : ''}${plural(g.tests.length, 'test')} · ${c.passed} passed · ${c.failed} failed${c.other ? ` · ${c.other} not run yet` : ''}`, flush: true, body: `<div class="rows">${rows}</div>` })}
      ${g.tests.some((t) => t.source === 'traceqa') ? codeCard : ''}`);
  },

  /** Every test in the framework as one list: TraceQA's and hand-written ones, linked to a requirement or not. */
  testsAll(d, preset) {
    if (preset === 'unlinked') S.testLink = 'no';
    const head = testsHead(d, 'all', btn('run-dialog', 'Run tests…', '', 'primary', 'play'));
    if (!d.all.length) return head + card({ body: emptyState('tests', 'No tests yet', `${d.installed ? '' : 'Create the framework first, then '}write tests with AI or from your AI coding tool. Playwright tests you write yourself in <code>${esc(d.framework)}/tests/</code> appear here too.`, d.installed ? btn('generate', 'Write tests with AI', '', 'primary', 'sparkle') : btn('job', 'Create framework', 'data-kind="scaffold"', 'primary', 'refresh')) });
    const rank = { failed: 0, flaky: 1, notrun: 2, skipped: 3, passed: 4 };
    const stOf = (t) => statusOf(t) || 'notrun';
    const list = d.all.slice().sort((a, b) => rank[stOf(a)] - rank[stOf(b)] || String(a.requirementId || '~').localeCompare(String(b.requirementId || '~')) || a.file.localeCompare(b.file) || (a.line || 0) - (b.line || 0));
    const count = (f) => list.filter((t) => stOf(t) === f).length;
    const statusF = S.testFilter || 'all', linkF = S.testLink || 'all';
    const seg = (action, current, opts, label) => `<div class="segmented" role="group" aria-label="${label}">${opts.map(([f, l, n]) => `<button type="button" data-action="${action}" data-f="${f}" aria-pressed="${current === f}">${l}${n !== undefined ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;
    const statusOpts = [['all', 'All', list.length], ...[['failed', 'Failed'], ['flaky', 'Flaky'], ['passed', 'Passed'], ['notrun', 'Not run yet'], ['skipped', 'Skipped']].map(([f, l]) => [f, l, count(f)]).filter(([, , n]) => n)];
    const linked = list.filter((t) => t.linked).length;
    const linkOpts = [['all', 'Any'], ['yes', 'Linked', linked], ['no', 'Not linked', list.length - linked]];
    const rows = list.map((t, i) => {
      const hand = t.source === 'hand-written';
      const req = t.requirementId ? (t.linked ? `<a class="mono" href="#/tests/${enc(t.requirementId)}">${esc(t.requirementId)}</a>${t.requirementTitle ? ` <span>${esc(t.requirementTitle)}</span>` : ''}` : `<span class="mono">${esc(t.requirementId)}</span> <span class="tag">requirement not found</span>`) : '<span class="tag">Not linked</span>';
      return `<li data-status="${esc(stOf(t))}" data-linked="${t.linked ? 'yes' : 'no'}" data-search="${esc([t.title, t.fullTitle, t.requirementId, t.requirementTitle, t.file, t.id].filter(Boolean).join(' ').toLowerCase())}"><details>
        <summary><span class="caret">${icon('chevron')}</span>
          <div><div class="r-t">${esc(t.title)}</div><div class="r-m">${req}<span class="tag">${hand ? 'Hand-written' : 'TraceQA'}</span>${t.latest ? `<span>${esc(t.latest.project)}${t.latest.browsers > 1 ? ` +${t.latest.browsers - 1}` : ''}</span><span>${(t.latest.durationMs / 1000).toFixed(1)} s</span>` : ''}${t.file ? `<span class="mono">${esc(t.file.replace(/^.*?\/tests\//, ''))}${t.line ? ':' + t.line : ''}</span>` : ''}</div></div>
          <div class="r-side">${statusChip(t)}${t.latest && t.latest.verdict ? `<span class="tag" title="${esc(VERDICT[t.latest.verdict] || '')}">${esc(t.latest.verdict)}</span>` : ''}${runBtn(t)}</div>
        </summary>
        <div class="r-body">
          ${t.criterion ? `<div class="crit">Proves ${esc(t.acId || '')}: ${esc(t.criterion)}</div>` : ''}
          ${!t.inFramework ? callout('warn', 'Its requirement was removed, so this test is no longer in the framework. Remove it, or bring the requirement back.') : ''}
          ${hand ? `<div class="small muted">A Playwright test written by hand in <span class="mono">${esc(t.file)}</span>. TraceQA runs it and shows its results; ${t.linked ? `it counts towards ${esc(t.requirementId)} because its title has the tag <code>@${esc(t.requirementId)}</code>.` : `to link it to a requirement, add the requirement’s tag to its title, e.g. <code>@REQ-142</code>.`}</div>` : stepsList(t)}
          ${failure(t)}
          ${t.code ? codeView(t.code, `code-${i}`, null, t.line) : ''}
          ${hand ? '' : `<div class="form-actions">${t.linked ? linkBtn(`#/tests/${enc(t.requirementId)}`, 'Open with its requirement', 'sm', 'requirements') : ''}${btn('remove-test', 'Remove', `data-test="${esc(t.id)}"`, 'sm ghost danger', 'trash')}</div>`}
        </div></details></li>`;
    }).join('');
    const intro = d.handWritten
      ? `${plural(list.length, 'test')}: ${list.length - d.handWritten} written by TraceQA and ${d.handWritten} by hand.`
      : `${plural(list.length, 'test')}, all written by TraceQA. Playwright tests you add by hand to <code>${esc(d.framework)}/tests/</code> appear here too.`;
    return head + card({
      title: 'All tests',
      sub: `${intro} ${d.unlinked ? `${d.unlinked} not linked to a requirement.` : 'Every test is linked to a requirement.'}`,
      flush: true,
      body: `<div class="toolbar" style="padding:12px 20px;margin:0;border-top:1px solid var(--border-2)">${seg('test-filter', statusF, statusOpts, 'Result')}${seg('test-link', linkF, linkOpts, 'Requirement')}<div style="flex:1 1 220px;display:flex">${searchBox('tests', '#testList > li', 'Search tests, requirements or files', '#testNoMatch')}</div></div>
        <ul class="results" id="testList" data-f="${esc(statusF)}" data-l="${esc(linkF)}">${rows}</ul><p class="empty" id="testNoMatch" style="padding:16px 20px" hidden>No tests match.</p>`,
    });
  },

  async runs(id) {
    const d = await api('/api/runs');
    const run = id ? await api(`/api/runs/${enc(id)}`) : d.runs.length ? await api(`/api/runs/${enc(d.runs[0].id)}`) : null;
    await refreshJobs();
    const applying = new Set(S.jobs.filter((j) => j.kind === 'review-heal' && (j.status === 'queued' || j.status === 'running')).map((j) => String((j.params || {}).healId || '').toUpperCase()));
    const head = page({ title: 'Runs & heals', desc: 'Every run is sorted into app bugs, broken tests, flaky tests and environment problems. Broken tests can be healed here.', actions: btn('heal-dialog', 'Heal…', '', '', 'heal') + btn('run-dialog', 'Run tests…', '', 'primary', 'play') });
    const items = d.runs.map((r) => listItem(`#/runs/${enc(r.id)}`, !!run && r.id === run.id, esc(r.id), `<span class="small muted">${r.totals.passed}/${r.totals.total}</span>`, `<div class="bar" style="height:6px;margin:6px 0 4px">${['passed', 'failed', 'flaky', 'skipped'].filter((k) => r.totals[k]).map((k) => `<div style="flex:${r.totals[k]} 1 0;background:${RESULT[k][1]}"></div>`).join('')}</div>${when(r.startedAt)} · ${(r.durationMs / 1000).toFixed(1)} s${r.filter ? ' · filtered' : ''}`)).join('');
    const rank = { failed: 0, flaky: 1, skipped: 2, passed: 3 };
    const failures = run ? run.results.filter((r) => r.status === 'failed').length : 0;
    const results = run ? run.results.slice().sort((a, b) => rank[a.status] - rank[b.status]).map((r, i) => {
      const shots = r.attachments.filter((a) => /\.(png|jpe?g)(\?|$)/i.test(a.url));
      const files = r.attachments.filter((a) => !shots.includes(a));
      const title = r.title.replace(/\s@\S+$/, '');
      const open = r.status === 'failed' && failures <= 5;
      return `<li data-status="${esc(r.status)}" data-search="${esc((r.title + ' ' + r.file + ' ' + (r.requirementId || '')).toLowerCase())}"><details${open ? ' open' : ''}>
        <summary><span class="caret">${icon('chevron')}</span>
          <div><div class="r-t">${esc(title)}</div><div class="r-m">${r.requirementId ? `<a class="mono" href="#/requirements/${enc(r.requirementId)}">${esc(r.requirementId)}</a>` : ''}${r.acId ? `<span class="mono">${esc(r.acId)}</span>` : ''}<span>${esc(r.project)}</span><span>${(r.durationMs / 1000).toFixed(1)} s</span><span class="mono">${esc(r.file)}${r.line ? ':' + r.line : ''}</span></div></div>
          <div class="r-side">${chip(RESULT, r.status)}${r.verdict ? `<span class="tag" title="${esc(VERDICT[r.verdict] || '')}">${esc(r.verdict)}</span>` : ''}${r.testDefId && r.status !== 'passed' ? btn('run-test', 'Re-run', `data-test="${esc(r.testDefId)}"`, 'sm', 'play') : ''}</div>
        </summary>
        <div class="r-body">
          ${r.verdict && VERDICT[r.verdict] ? `<div class="verdict-note"><b>${esc(r.verdict)}:</b> ${esc(VERDICT[r.verdict])}</div>` : ''}
          ${r.error ? `<pre class="err">${esc(stripAnsi(r.error).split('\n').slice(0, 40).join('\n'))}</pre>` : r.status === 'passed' ? '<div class="small muted">Passed. Every check in this test held.</div>' : ''}
          ${shots.length ? `<div class="r-shots">${shots.map((a) => shotBtn(a.url, `${title} · ${a.name}`, `run-${run.id}-${i}`, '', `<img loading="lazy" src="${esc(a.url)}" alt="">`)).join('')}</div>` : ''}
          ${files.length ? `<div class="row-meta">${files.map((a) => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${icon('file', 13)} ${esc(a.name)}</a>`).join(' · ')}</div>` : ''}
        </div></details></li>`;
    }).join('') : '';
    const counts = run ? ['failed', 'flaky', 'passed', 'skipped'].map((k) => [k, run.results.filter((r) => r.status === k).length]) : [];
    const runFilter = S.runFilter || 'all';
    const resultTools = run ? `<div class="toolbar" style="padding:12px 20px;margin:0;border-top:1px solid var(--border-2)"><div class="segmented" role="group" aria-label="Show results">${[['all', 'All', run.results.length], ...counts.filter(([, n]) => n).map(([k, n]) => [k, RESULT[k][0], n])].map(([f, l, n]) => `<button type="button" data-action="run-filter" data-f="${f}" aria-pressed="${runFilter === f}">${l} <span class="n">${n}</span></button>`).join('')}</div><div style="flex:0 1 280px;display:flex">${searchBox('run', '#runResults > li', 'Search tests', '#runNoMatch')}</div></div>` : '';
    const heals = d.heals.map((h) => `<li><div class="row-line"><div class="grow"><div class="row-title">${esc(h.id)} <span class="mono muted small">${esc(h.testId)}</span></div><div class="row-meta">${chip(HEAL, h.status)}<span>${when(h.createdAt)}</span></div></div>
      ${h.status === 'proposed' ? (applying.has(h.id) ? '<span class="chip"><span class="dot pulse" style="background:var(--ambiguous)"></span>Applying…</span>' : `<div class="actions">${btn('heal-apply', 'Apply', `data-heal="${esc(h.id)}"`, 'sm primary', 'check')}${btn('heal-reject', 'Reject', `data-heal="${esc(h.id)}"`, 'sm', 'x')}</div>`) : ''}</div>
      ${h.fixes.map((f) => `<div class="diff"><span class="k">Step ${f.stepIndex + 1} · ${esc(f.action)}</span><span class="old">${esc(f.oldCode)}</span><span class="k">Now · ${f.confidence}</span><span class="new">${esc(f.newCode)}</span></div>`).join('')}
      ${h.check ? `<div class="row-meta" style="margin-top:6px">Re-run: ${esc(h.check.status)}${h.check.verdict ? ' · ' + esc(h.check.verdict) : ''}${h.check.status === 'failed' && h.check.verdict === 'app-bug' ? ' — the locator is fixed; the assertion now fails, which looks like a real app bug' : ''}</div>` : ''}${h.reason ? `<div class="row-meta" style="margin-top:4px">${esc(h.reason)}</div>` : ''}</li>`).join('');
    const healCard = card({ title: `Heals <span class="badge">${d.heals.length}</span>`, sub: 'Locator fixes for tests that broke after a UI change. Assertions are never changed.', flush: true, body: heals ? `<ul class="plain">${heals}</ul>` : '<div style="padding:16px 20px" class="empty">No heals yet.</div>' });
    if (!run) return head + card({ body: emptyState('runs', 'No runs yet', 'Run the tests to see results sorted by verdict.', btn('run-dialog', 'Run tests…', '', 'primary', 'play')) }) + healCard;
    const t = run.totals;
    return head + split('Runs', d.runs.length, items, `
      ${card({ title: esc(run.id), sub: `${when(run.startedAt)} · ${(run.durationMs / 1000).toFixed(1)} s${run.filter ? ` · filter <code>${esc(run.filter)}</code>` : ''}${run.bugs.length ? ' · bugs ' + run.bugs.map((b) => `<a class="mono" href="#/bugs/${enc(b)}">${esc(b)}</a>`).join(', ') : ''}`,
        body: `<div class="stats">${['passed', 'failed', 'flaky', 'skipped'].map((k) => `<div class="stat"><div class="label"><span class="dot" style="background:${RESULT[k][1]}"></span>${RESULT[k][0]}</div><div class="value">${t[k]}</div></div>`).join('')}</div>
        <div class="bar" style="margin-top:14px" role="img" aria-label="${t.passed} passed, ${t.failed} failed, ${t.flaky} flaky, ${t.skipped} skipped">${['passed', 'failed', 'flaky', 'skipped'].filter((k) => t[k]).map((k) => `<div style="flex:${t[k]} 1 0;background:${RESULT[k][1]}"></div>`).join('')}</div>
        <div style="margin:18px -20px -18px">${resultTools}<ul class="results" id="runResults" data-f="${esc(runFilter)}">${results}</ul><p class="empty" id="runNoMatch" style="padding:16px 20px" hidden>No tests match.</p></div>` })}
      ${healCard}`);
  },

  async bugs(id) {
    if (id) return views.bug(id);
    const d = await api('/api/bugs');
    const shown = d.bugs.filter((b) => bugFilter === 'all' || (bugFilter === 'open' ? b.status !== 'discarded' : b.status === bugFilter));
    const count = (f) => d.bugs.filter((b) => f === 'all' || (f === 'open' ? b.status !== 'discarded' : b.status === f)).length;
    const filters = ['open', 'draft', 'approved', 'filed', 'discarded', 'all'].map((f) => `<button type="button" data-action="bug-filter" data-f="${f}" aria-pressed="${bugFilter === f}">${f[0].toUpperCase() + f.slice(1)} <span class="n">${count(f)}</span></button>`).join('');
    const head = page({ title: 'Bugs', desc: 'Drafted from explorations and test runs. Nothing is filed until someone decides to.' });
    if (!d.bugs.length) return head + card({ body: emptyState('bugs', 'No bugs yet', 'Bugs are drafted when a test fails on the app, or an exploration records a finding.') });
    return head + `<div class="toolbar"><div class="segmented" role="group" aria-label="Filter by status">${filters}</div><div style="flex:0 1 320px;display:flex">${searchBox('bug', '#bugTable tbody tr', 'Search bugs', '#bugNoMatch')}</div></div>` +
      card({ flush: true, body: `<div class="table-wrap"><table class="data" id="bugTable"><thead><tr><th>Bug</th><th>Title</th><th>Requirement</th><th>Severity</th><th>Status</th></tr></thead><tbody>

  async bug(id) {
    const d = await api(`/api/bugs/${enc(id)}`);
    const b = d.bug;
    S.bug = b;
    const actions = b.status === 'filed' ? '' : b.status === 'discarded'
      ? btn('bug-status', 'Reopen as draft', `data-id="${esc(b.id)}" data-status="draft"`, '', 'refresh')
      : `${btn('bug-edit', 'Edit', '', '', 'edit')}${btn('bug-status', 'Discard', `data-id="${esc(b.id)}" data-status="discarded"`, 'danger', 'trash')}${b.status === 'draft' ? btn('bug-status', 'Approve', `data-id="${esc(b.id)}" data-status="approved"`, '', 'check') : ''}
         <button type="button" class="btn primary" data-action="bug-file" data-id="${esc(b.id)}" ${d.jiraConfigured ? '' : 'disabled title="Set up Jira in Settings first"'}>${icon('external')}<span>File in Jira</span></button>`;
    const evidence = b.evidence.map((e) => e.url && /\.(png|jpe?g)$/i.test(e.file) ? `<figure><a href="${esc(e.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(e.url)}" alt="${esc(e.name)}"></a><figcaption>${esc(e.name)}</figcaption></figure>` : `<figure><figcaption>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${icon('file', 14)} ${esc(e.name)}: ${esc(e.file)}</a>` : esc(e.name) + ' (file no longer exists)'}</figcaption></figure>`).join('');
    return page({
      title: b.title,
      meta: `<span class="tag mono">${esc(b.id)}</span>${chip(BUG, b.status)}${chip(SEVERITY, b.severity)}${b.ticket ? `<a class="tag mono" href="${esc(b.ticket.url)}" target="_blank" rel="noopener">${esc(b.ticket.key)}</a>` : ''}`,
      actions,
    }) + (d.jiraConfigured || b.status === 'filed' || b.status === 'discarded' ? '' : callout('info', 'To file bugs in Jira, add your Jira site in <a href="#/settings">Settings</a>.')) +
      `<div class="cols"><div class="stack-lg">
        ${card({ title: 'Steps to reproduce', body: `<ol class="steps-list" style="font-size:14px;margin:0">${b.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>` })}
        ${card({ title: 'Expected and actual', body: `<div class="ea"><div><span class="k">Expected</span>${esc(b.expected)}</div><div class="bad"><span class="k">Actual</span>${esc(b.actual)}</div></div>${b.note ? `<p style="margin-top:12px"><b>Note:</b> ${esc(b.note)}</p>` : ''}` })}
        ${card({ title: `Evidence <span class="badge">${b.evidence.length}</span>`, body: `<div class="thumbs">${evidence || '<p class="empty">None.</p>'}</div>` })}
      </div>
      ${card({ title: 'Details', body: `<dl class="dl"><dt>Requirement</dt><dd>${b.requirementId ? `<a class="mono" href="#/requirements/${enc(b.requirementId)}">${esc(b.requirementId)}</a> ${esc(b.acId || '')}` : '—'}</dd><dt>Environment</dt><dd>${esc(b.environment)}</dd><dt>Found by</dt><dd>${esc(b.source.kind)} <span class="mono small">${esc(b.source.ref)}</span></dd>${b.alsoSeenIn && b.alsoSeenIn.length ? `<dt>Also seen in</dt><dd>${esc(b.alsoSeenIn.join(', '))}</dd>` : ''}<dt>Created</dt><dd>${when(b.createdAt)}</dd><dt>Updated</dt><dd>${when(b.updatedAt)}</dd></dl>` })}
      </div>`;
  },

  async agent() {
    await refreshState();
    const ai = S.state.ai;
    const who = ai.providerLabel || 'Anthropic';
    const reqs = await reqList(true);
    const recent = ai.recent.map((r) => `<li><div class="row-line"><a class="row-title" href="#/jobs/${enc(r.id)}">${esc(r.label)}</a>${chip(JOB, r.status)}</div><div class="row-meta">${esc(fmtUsage(r.usage))}</div></li>`).join('');
    const task = (ic, title, text, action) => `<div class="row-item"><div class="row-line" style="align-items:center"><div class="grow" style="display:flex;gap:12px;align-items:center"><span class="tile-ic">${icon(ic)}</span><div><div class="row-title">${title}</div><div class="cell-sub">${text}</div></div></div><div class="actions">${action}</div></div></div>`;
    return page({ title: 'AI agent', desc: `TraceQA’s own agent, for work without an AI coding tool. ${ai.local ? `It runs on this computer with ${esc(who)}, at no cost.` : `Every run is billed to your ${esc(who)} account.`}` }) +
      (ai.configured ? '' : callout('warn', ai.missing === 'model' ? `No ${esc(who)} model is chosen yet. Pick one in <a href="#/settings">Settings → AI agent</a> before starting a task.` : `No ${esc(who)} API key is set yet. Add it in <a href="#/settings">Settings → AI agent</a> before starting a task.`)) +
      `<div class="cols"><div class="stack-lg">
        ${card({ title: 'Ask the agent', sub: 'Describe the task in plain words. You confirm before anything is billed.', body: `<form data-form="agent" class="stack" id="agentForm">${textareaField({ label: 'Task', name: 'task', rows: 4, required: true, placeholder: 'e.g. Test REQ-131 and REQ-150, then tell me which criteria fail' })}</form>`, foot: `<button class="btn primary" type="submit" form="agentForm"><span class="ai-mark">${icon('sparkle')}</span><span>Start…</span></button>` })}
        ${card({ title: 'Common tasks', flush: true, body: `<div class="rows">
          ${task('appmap', 'Explore the whole app', 'No requirements needed. Finds bugs across the app and can automate its main flows as E2E tests.', btn('explore-app', 'Explore…', '', 'sm', 'sparkle'))}
          ${task('sessions', 'Explore a requirement', 'Tries every criterion in a real browser; problems become draft bugs with screenshots.', btn('explore', 'Explore…', '', 'sm', 'sparkle'))}
          ${task('file', 'Read a document that is mostly prose', 'Requirement documents in any format are read automatically. For prose-heavy ones, “Read with AI” lists what it finds; the document is not changed.', linkBtn('#/requirements/files', 'Open files', 'sm', 'upload'))}
          ${task('tests', 'Write tests', 'One test per acceptance criterion, checked and run.', btn('generate', 'Write tests…', '', 'sm', 'sparkle'))}
          ${task('heal', 'Fix tests healing could not fix', 'Heal first; the agent takes what is left.', btn('heal-dialog', 'Heal…', '', 'sm', 'heal'))}</div>` })}
      </div><div class="stack-lg">
        ${card({ title: 'Setup', actions: linkBtn('#/settings', 'Change', 'sm ghost', 'settings'), body: `<dl class="dl"><dt>Provider</dt><dd>${esc(who)}${ai.local ? ' <span class="tag">on this computer</span>' : ''}</dd><dt>Model</dt><dd>${ai.model ? `<code>${esc(ai.model)}</code>` : '<span class="badge warn">Not chosen</span>'}</dd>${ai.local ? '' : `<dt>Effort</dt><dd>${esc(ai.effort)}</dd>`}<dt>Turn limit</dt><dd>${ai.maxTurns}</dd><dt>${ai.local ? 'Cost' : 'API key'}</dt><dd>${ai.local ? 'None' : ai.configured ? `<span class="badge ok">Set</span> <span class="small muted">${esc(ai.source)}</span>` : '<span class="badge warn">Not set</span>'}</dd><dt>Requirements</dt><dd>${reqs.length}</dd></dl>` })}
        ${card({ title: 'Recent AI jobs', flush: true, body: recent ? `<ul class="plain">${recent}</ul>` : '<div style="padding:16px 20px" class="empty">None yet.</div>', foot: `<span class="small muted">${ai.local ? 'Local models cost nothing; token counts are shown for reference.' : ai.provider === 'openrouter' ? 'Costs are what OpenRouter reported for each request.' : 'Costs are estimates from list prices; your Anthropic Console has the exact bill.'}</span>` })}
      </div></div>`;
  },

  async jobs(id) {
    const d = await api('/api/jobs');
    S.jobs = d.jobs;
    const head = page({ title: 'Jobs', desc: 'Everything started from this dashboard runs here one at a time, with its full output.' });
    if (!d.jobs.length) return head + card({ body: emptyState('jobs', 'No jobs yet', 'Buttons like “Run tests” and “Analyze app” start jobs. They appear here with live output.') });
    const sel = d.jobs.find((j) => j.id === (id || '').toUpperCase()) || d.jobs[0];
    const j = (await api(`/api/jobs/${enc(sel.id)}`)).job;
    S.jobView = j;
    const items = d.jobs.map((x) => listItem(`#/jobs/${enc(x.id)}`, x.id === j.id, `${esc(x.label)}`, chip(JOB, x.status),
      `${esc(x.id)} · ${when(x.createdAt)}${x.ai ? ' · AI' : ''}${x.status === 'running' && x.progress ? `<br><span class="small">${esc(x.progress.activity)}</span>` : ''}`)).join('');
    const active = j.status === 'running' || j.status === 'queued';
    const p = j.progress;

    // The latest screenshot of the exploration this job is driving.
    let shot = '';
    if (j.sessionId) {
      const s = (await api(`/api/sessions/${enc(j.sessionId)}`).catch(() => ({}))).session;
      if (s) shot = card({ title: `${s.live ? '<span class="dot pulse" style="background:var(--failing)"></span> Live browser' : 'Last screenshot'}`, sub: `Session ${esc(s.id)}`, actions: linkBtn(`#/sessions/${enc(s.id)}`, 'All steps', 'sm ghost', 'chevron'), body: `<div id="liveShot">${liveShotHtml(s)}</div>` });
    }

    const summary = card({
      title: `${esc(j.label)} ${chip(JOB, j.status)}`,
      sub: `${esc(j.id)}${j.ai ? ' · <span class="tag ai">AI</span>' : ''} · started ${when(j.startedAt || j.createdAt)}${j.usage ? ` · ${esc(fmtUsage(j.usage))}` : ''}`,
      actions: active ? btn('job-stop', j.status === 'queued' ? 'Cancel' : 'Stop', `data-id="${esc(j.id)}"`, 'danger', 'stop') : '',
      body: p
        ? `<div class="stack-lg"><div id="prog-phases">${phasesHtml(p, j.status)}</div><div id="prog-now">${nowHtml(j, p)}</div><div id="prog-counts">${countsHtml(p)}</div></div>`
        : `<div class="stack-lg">${active ? `<div class="now"><span class="now-ic">${j.status === 'running' ? '<span class="spinner" aria-hidden="true"></span>' : icon('jobs')}</span><div class="grow"><div class="now-k">${j.status === 'running' ? 'Now' : 'Waiting'}</div><div class="now-t">${esc(j.status === 'running' ? (j.log[j.log.length - 1] || 'Starting…') : 'Waiting for the job before it to finish…')}</div></div><span class="elapsed"${j.status === 'running' ? ` data-since="${esc(j.startedAt || '')}"` : ''}>${j.startedAt ? dur(j.startedAt) : ''}</span></div>` : `<dl class="dl"><dt>Duration</dt><dd>${j.startedAt ? dur(j.startedAt, j.finishedAt) : '—'}</dd></dl>`}</div>`,
    });
    const errorBox = j.error ? callout(j.status === 'stopped' ? 'warn' : 'error', `<div class="md">${md(j.error)}</div>`) : '';
    const result = j.result ? card({ title: j.ai ? 'Summary' : 'Result', body: resultBlock(j) }) : '';
    const filterBtns = [['all', 'Everything'], ['key', 'Key events']].map(([f, l]) => `<button type="button" data-action="feed-filter" data-f="${f}" aria-pressed="${feedFilter === f}">${l}</button>`).join('');
    const feed = p
      ? `<section class="card"><div class="card-head"><div><h2>Activity</h2><div class="sub">Every action the agent took, as it happens.</div></div><div class="actions"><div class="segmented" role="group" aria-label="Show">${filterBtns}</div></div></div><ul class="feed" id="prog-feed" data-keep-scroll data-stick tabindex="0" aria-label="Activity">${feedItems(p)}</ul></section>`
      : '';
    const log = `<section class="card"><details${p ? '' : ' open'}><summary class="card-head" style="cursor:pointer"><h2>${p ? 'Technical log' : 'Output'}</h2><span class="small muted">${plural(j.log.length, 'line')}</span></summary><pre class="console" id="joblog" data-job="${esc(j.id)}" tabindex="0" aria-label="Job output">${esc(j.log.join('\n'))}</pre></details></section>`;
    const body = p
      ? `${summary}${errorBox}${result}${shot ? `<div class="progress-grid">${feed}${shot}</div>` : feed}${log}`
      : `${summary}${errorBox}${result}${shot}${log}`;
    return head + split('Jobs', d.jobs.length, items, body);
  },

/** Fills a provider's model picker: OpenRouter's public list, or what Ollama / LM Studio have installed. */
async function loadModels(provider, quiet) {
  const panel = $(`[data-provider="${provider}"]`);
  if (!panel) return;
  const list = $(`#models-${provider}`);
  const hint = $(`#hint-${provider}`);
  const status = $(`#check-${provider}`);
  const base = panel.querySelector('[name$=".baseUrl"]')?.value || '';
  const input = panel.querySelector('[name$=".model"]');
  if (status && !quiet) status.textContent = 'Checking…';
  try {
    const { models } = await api(`/api/ai-models?provider=${enc(provider)}&baseUrl=${enc(base)}`, { headers: { 'X-TraceQA': '1' } });
    const price = (m) => (m.input !== undefined ? ` · $${m.input.toFixed(2)} / $${m.output.toFixed(2)} per M tokens` : '');
    const tools = (m) => (m.tools === true ? ' · tools ✓' : m.tools === false ? ' · no tool support' : '');
    list.innerHTML = models.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}${esc(price(m))}${esc(tools(m))}</option>`).join('');
    if (status) {
      const withTools = models.filter((m) => m.tools === true).length;
      status.innerHTML = models.length
        ? `<span style="color:var(--ok)">${icon('check', 14)} Connected:</span> ${plural(models.length, 'model')}${provider === 'ollama' ? `, ${withTools} with tool support` : ''}.`
        : `<span style="color:var(--warn)">Connected, but no models are installed.</span> ${provider === 'ollama' ? 'Run “ollama pull qwen3”, for example.' : 'Download a model in LM Studio.'}`;
    }
    const show = () => {
      const m = models.find((x) => x.id === input.value.trim());
      if (!hint) return;
      if (!input.value.trim()) hint.textContent = `${plural(models.length, 'model')} available.`;
      else if (!m) hint.textContent = provider === 'openrouter' ? 'Not in OpenRouter’s list of tool-calling models; check the id.' : 'Not installed. Check the name, or install it first.';
      else if (m.tools === false) hint.innerHTML = `<span style="color:var(--danger)">${esc(m.name)} cannot use tools, and TraceQA’s agent needs them. Pick another model.</span>`;
      else hint.textContent = `${m.name}${price(m)}${m.context ? ` · ${Math.round(m.context / 1000)}k context` : ''}${m.tools ? ' · supports tool calling' : ''}`;
    };
    input.oninput = show;
    show();
  } catch (err) {
    if (status) status.innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
    else if (hint && !quiet) hint.textContent = err.message;
    else if (hint) hint.textContent = provider === 'openrouter' ? 'Could not load the model list from OpenRouter; type a model id such as anthropic/claude-opus-5.5.' : err.message;
  }
}

// ---------- routing, rendering, live updates ----------
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map((p) => { try { return decodeURIComponent(p); } catch { return p; } });
  const view = parts[0] && views[parts[0]] && !['setup', 'reqFiles', 'requirement', 'bug', 'testsAll'].includes(parts[0]) ? parts[0] : 'overview';
  return [view, ...parts.slice(1)];
}

function renderCrumbs(view, args) {
  const items = [{ label: (S.state && S.state.ready && S.state.project) || 'TraceQA', href: '#/' }];
  if (S.state && !S.state.ready) items.push({ label: 'Set up' });
  else if (view === 'report') items.push({ label: 'Overview', href: '#/' }, { label: 'Coverage report' });
  else if (view !== 'overview') {
    items.push({ label: VIEW_LABEL[view], href: `#/${view}` });
    if (view === 'requirements' && args[0] === 'files') {
      items.push({ label: 'Files', href: '#/requirements/files' });
      if (args[1]) items.push({ label: args[1] === 'new' ? 'New file' : args[1] });
    } else if (view === 'tests' && args[0] === 'all') items.push({ label: 'All tests' });
    else if (args[0]) items.push({ label: args[0] });
  }
  items[items.length - 1].current = true;
  $('#crumbs').innerHTML = `<ol>${items.map((i) => `<li>${i.current ? `<span aria-current="page">${esc(i.label)}</span>` : `<a href="${i.href}">${esc(i.label)}</a>`}</li>`).join('')}</ol>`;
}

let rendering = false, pending = false, lastKey = '';
async function render() {
  if (rendering) { pending = true; return; }
  rendering = true;
  let [view, ...args] = route();
  if (S.state && !S.state.ready) { view = 'setup'; args = []; }
  const key = location.hash;
  const sameRoute = key === lastKey;
  const y = window.scrollY;
  const log = $('#joblog');
  const logAtBottom = log ? log.scrollTop + log.clientHeight >= log.scrollHeight - 30 : true;
  const logOpen = log ? log.closest('details')?.open : undefined;
  // Scrollable panels (activity, code) keep their place when the page re-draws with new data.
  const kept = [...document.querySelectorAll('[data-keep-scroll][id]')].map((el) => [el.id, el.scrollTop, el.scrollTop + el.clientHeight >= el.scrollHeight - 40]);
  const navView = view === 'report' ? 'overview' : view;
  document.querySelectorAll('#nav .nav-item').forEach((a) => a.setAttribute('aria-current', a.dataset.view === navView ? 'page' : 'false'));
  renderCrumbs(view, args);
  closeNav();
  fid = 0;
  try {
    const html = await views[view](...args);
    $('#main').innerHTML = html;
    const mountKey = view === 'requirements' && args[0] === 'files' ? 'reqFiles' : view;
    mounts[mountKey]?.(...args);
    document.querySelectorAll('#main [data-filter]').forEach(applyFilter);
    if (sameRoute) {
      window.scrollTo(0, y);
      const nl = $('#joblog');
      if (nl && logOpen !== undefined && nl.closest('details')) nl.closest('details').open = logOpen;
      if (nl && !logAtBottom && log) nl.scrollTop = log.scrollTop;
      else if (nl) nl.scrollTop = nl.scrollHeight;
      for (const [kid, top, bottom] of kept) {
        const el = document.getElementById(kid);
        if (el) el.scrollTop = bottom && el.hasAttribute('data-stick') ? el.scrollHeight : top;
      }
    } else {
      window.scrollTo(0, 0);
      document.querySelectorAll('[data-stick]').forEach((el) => { el.scrollTop = el.scrollHeight; });
      const nl = $('#joblog');
      if (nl) nl.scrollTop = nl.scrollHeight;
    }
  } catch (err) {
    if (err.status === 409 && /not set up/i.test(err.message)) { await refreshState(); rendering = false; return render(); }
    $('#main').innerHTML = `<div class="error-page">${esc(err.message)}</div>`;
  }
  lastKey = key;
  rendering = false;
  if (pending) { pending = false; render(); }
}

function applyFilter(input) {
  const term = input.value.trim().toLowerCase();
  S.filters[input.dataset.key] = input.value;
  const rows = [...document.querySelectorAll(input.dataset.filter)];
  let shown = 0;
  for (const r of rows) { const hit = !term || (r.dataset.search || '').includes(term); r.hidden = !hit; if (hit) shown++; }
  if (input.dataset.empty) { const e = $(input.dataset.empty); if (e) e.hidden = shown > 0; }
}

function isEditing() {
  const main = $('#main');
  if (main.querySelector('form[data-dirty]')) return true;
  const a = document.activeElement;
  if (a && a.matches && a.matches('[data-filter]')) return false;
  return !!(a && main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || $('#dlg').open;
}
function liveRefresh() {
  if (isEditing()) { const bar = $('#updbar'); if (bar) bar.hidden = false; return; }
  render();
}

function toast(html, ms = 6000, kind = 'info') {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `<div class="body">${html}</div><button type="button" class="btn ghost icon sm" aria-label="Dismiss">${icon('x')}</button>`;
  t.querySelector('button').onclick = () => t.remove();
  box.append(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  if (ms) setTimeout(() => t.remove(), ms);
}
const toastError = (err) => toast(esc(err.message), 12000, 'error');

function buildNav() {
  $('#nav').innerHTML = NAV.map(([group, items]) => `<div class="nav-group"><div class="nav-label">${group}</div>${items.map(([view, href, label]) => `<a class="nav-item" href="${href}" data-view="${view}">${icon(view)}<span>${label}</span><span class="badge-n" id="badge-${view}" hidden></span></a>`).join('')}</div>`).join('');

}

function setBadge(view, n, kind = '') {
  const b = $(`#badge-${view}`);

  b.hidden = !n;
  b.textContent = n || '';
  b.className = `badge-n ${kind}`;
}

async function refreshState() {
  try { S.state = await api('/api/state'); } catch { return; }
  const st = S.state;
  $('#projName').textContent = st.ready ? st.project : 'Not set up';
  $('#projUrl').textContent = st.ready ? st.baseUrl : st.dir;
  $('#ver').textContent = st.version ? `v${st.version}` : '';
  document.title = st.ready ? `TraceQA · ${st.project}` : 'TraceQA · Set up';
  $('#nav').hidden = !st.ready;
  if (st.ready && st.counts) {
    setBadge('requirements', st.counts.unclearRequirements, 'warn');
    setBadge('runs', st.counts.proposedHeals, '');
    setBadge('bugs', st.counts.draftBugs, 'warn');
    setBadge('jobs', st.counts.activeJobs, 'live');
  }
}

async function refreshJobs() {
  if (!S.state || !S.state.ready) return;
  try { S.jobs = (await api('/api/jobs')).jobs; } catch { return; }
  const running = S.jobs.find((j) => j.status === 'running');
  const queued = S.jobs.filter((j) => j.status === 'queued').length;
  setBadge('jobs', (running ? 1 : 0) + queued, 'live');
  updatePill();
}
/** The topbar pill: the running job and, for AI jobs, what it is doing right now. */
function updatePill() {
  const el = $('#runningPill');
  const running = S.jobs.find((j) => j.status === 'running');
  const queued = S.jobs.filter((j) => j.status === 'queued').length;
  if (!running) { el.hidden = true; return; }
  const pr = running.progress;
  const text = pr && pr.activity && !pr.done ? `${pr.phaseLabel ? pr.phaseLabel + ': ' : ''}${pr.activity}` : running.label;
  el.hidden = false;
  el.href = `#/jobs/${enc(running.id)}`;
  el.title = `${running.label} (${running.id})${pr ? ` · ${pr.activity}` : ''}`;
  el.innerHTML = `<span class="dot pulse" style="background:#2E9E5B"></span><span class="t">${esc(text)}</span>${queued ? `<span class="badge">+${queued}</span>` : ''}`;
}

function openNav() { $('#shell').classList.add('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'true'); const first = $('#nav .nav-item'); if (first) first.focus(); }
function closeNav() { $('#shell').classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }

// ---------- actions ----------
document.addEventListener('click', async (e) => {
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a,button')) { location.hash = row.dataset.href; return; }
  if (e.target.closest('#nav .nav-item')) closeNav();
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'FORM') return;
  const a = el.dataset.action;
  // A button inside a <summary> should act, not open or close the details.
  if (el.closest('summary') && el.tagName === 'BUTTON') e.preventDefault();
  try {
    if (a === 'skip') { e.preventDefault(); $('#main').focus(); return; }
    if (a === 'shot') return openShots(el.dataset.shot, el.dataset.src);
    if (a === 'feed-filter') {
      feedFilter = el.dataset.f;
      el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      if (S.jobView && S.jobView.progress) { const f = $('#prog-feed'); if (f) { f.innerHTML = feedItems(S.jobView.progress); f.scrollTop = f.scrollHeight; } }
      return;
    }
    const FILTERS = { 'step-filter': ['stepFilter', '#stepline', 'f'], 'run-filter': ['runFilter', '#runResults', 'f'], 'test-filter': ['testFilter', '#testList', 'f'], 'test-link': ['testLink', '#testList', 'l'] };
    if (FILTERS[a]) {
      const [key, sel, attr] = FILTERS[a];
      S[key] = el.dataset.f;
      el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      const list = $(sel);
      if (list) list.dataset[attr] = el.dataset.f;
      return;
    }
    if (a === 'goto-step') {
      e.preventDefault();
      const li = $(`#step-${el.dataset.n}`);
      if (li) { li.scrollIntoView({ block: 'center' }); li.animate([{ background: 'var(--accent-soft)' }, { background: 'transparent' }], { duration: 1600 }); }
      return;
    }
    if (a === 'show-code') {
      const from = Number(el.dataset.from), to = Number(el.dataset.to);
      const view = $('#specCode');
      if (!view) return;
      view.querySelectorAll('.ln').forEach((ln) => { const n = Number(ln.dataset.ln); ln.classList.toggle('hl', n >= from && n <= to); });
      $('#specCard').scrollIntoView({ block: 'start' });
      const first = view.querySelector(`.ln[data-ln="${from}"]`);
      if (first) view.scrollTop = first.offsetTop - 20;
      return;
    }
    if (a === 'copy-code') {
      await navigator.clipboard.writeText((S.spec && S.spec.code) || '');
      return toast('Code copied.', 2500, 'ok');
    }
    if (a === 'open-nav') return openNav();
    if (a === 'close-nav') return closeNav();
    if (a === 'req-filter') { reqFilter = el.dataset.f; return render(); }
    if (a === 'bug-filter') { bugFilter = el.dataset.f; return render(); }
    if (a === 'refresh' || a === 'discard-settings') { document.querySelectorAll('#main form[data-dirty]').forEach((f) => delete f.dataset.dirty); return render(); }
    if (a === 'goto-section') { const t = $(el.dataset.target); if (t) { t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); document.querySelectorAll('.settings-nav button').forEach((b) => b.setAttribute('aria-current', String(b === el))); } return; }
    if (a === 'bug-edit') return await bugEditDialog();
    if (a === 'upload') return $('#uploadDoc').click();
    if (a === 'explore-app') return await exploreAppDialog();
    if (a === 'jira-import') return await jiraImportDialog();
    if (a === 'read-doc') return await readDocDialog(el.dataset.file);
    if (a === 'check-models') return await loadModels(el.dataset.check, false);
    if (a === 'run-dialog') return await runDialog();
    if (a === 'run-req') return await runDialog({ requirementId: el.dataset.req });
    if (a === 'run-test') return await startJob({ kind: 'run', testId: el.dataset.test });
    if (a === 'run-grep') return await startJob({ kind: 'run', grep: el.dataset.grep, title: el.dataset.title });
    if (a === 'heal-dialog') return await healDialog();
    if (a === 'explore') return await exploreDialog(el.dataset.req);
    if (a === 'generate') return await generateDialog(el.dataset.req ? [el.dataset.req] : []);
    el.disabled = true;
    if (a === 'job') {
      await startJob({ kind: el.dataset.kind });
    } else if (a === 'import') {
      const r = await post('/api/requirements/import');
      S.reqs = null;
      toast(`Imported ${plural(r.imported, 'requirement')} from ${plural(r.files, 'file')}${r.mapped ? ' and re-mapped them to pages' : ''}.${r.duplicates.length ? ' Duplicate IDs ignored: ' + esc(r.duplicates.join(', ')) : ''}`, 5000, 'ok');
    } else if (a === 'map') {
      const r = await post('/api/map');
      toast(`${plural(r.mapped, 'requirement')} mapped to pages.${r.unmapped.length ? ' No page for: ' + esc(r.unmapped.join(', ')) + '.' : ''}`, 6000, 'ok');
    } else if (a === 'render') {
      const r = await post('/api/render');
      toast(`Rendered ${plural(r.pageObjects, 'page object')} and ${plural(r.specs, 'spec file')}.`, 4000, 'ok');
    } else if (a === 'remove-test') {
      if (!(await confirmBox('Remove this test?', `<p><code>${esc(el.dataset.test)}</code> is deleted and its spec file is rewritten. Your version control still has the old code.</p>`, 'Remove test', true))) { el.disabled = false; return; }
      await post(`/api/tests/${enc(el.dataset.test)}/remove`);
      toast('Test removed.', 3000, 'ok');
    } else if (a === 'heal-apply') {
      await startJob({ kind: 'review-heal', healId: el.dataset.heal });
    } else if (a === 'heal-reject') {
      await post(`/api/heals/${enc(el.dataset.heal)}/reject`);
      toast(`${esc(el.dataset.heal)} rejected. The test was not changed.`, 4000, 'ok');
    } else if (a === 'bug-status') {

      if (s === 'discarded' && !(await confirmBox('Discard this bug?', '<p>It is hidden from the open list. You can reopen it later.</p>', 'Discard bug', true))) { el.disabled = false; return; }
      const r = await post(`/api/bugs/${enc(el.dataset.id)}/status`, { status: s });
      toast(`${esc(r.bug.id)} is now ${esc(r.bug.status)}.${r.exported ? ' Ticket text saved to ' + esc(r.exported) : ''}`, 5000, 'ok');
    } else if (a === 'bug-file') {
      if (!(await confirmBox('File this bug in Jira?', '<p>This creates an issue in your Jira project with the steps and evidence attached. If an open issue already exists for the same requirement criterion, TraceQA comments on it instead.</p>', 'File in Jira'))) { el.disabled = false; return; }
      const r = await post(`/api/bugs/${enc(el.dataset.id)}/file`);
      toast(`${esc(r.bug.id)} ${r.created ? 'filed as' : 'added to'} <a href="${esc(r.bug.ticket.url)}" target="_blank" rel="noopener">${esc(r.bug.ticket.key)}</a> · ${plural(r.attached, 'attachment')}.`, 8000, 'ok');
    } else if (a === 'reqfile-delete') {
      if (!(await confirmBox('Move this file to the trash?', `<p><code>${esc(el.dataset.file)}</code> moves to <code>.traceqa/trash/</code>, so you can get it back. Its requirements are removed from TraceQA.</p>`, 'Move to trash', true))) { el.disabled = false; return; }
      const r = await post('/api/requirement-files/delete', { file: el.dataset.file });
      S.reqs = null;
      toast(`Moved to ${esc(r.trashed)}. ${plural(r.imported, 'requirement')} remain.`, 6000, 'ok');
      location.hash = '#/requirements/files';
    } else if (a === 'forget-reading') {
      if (!(await confirmBox('Use the automatic reading?', `<p>The AI’s reading of <code>${esc(el.dataset.file)}</code> is deleted, and TraceQA reads the document by itself again. To get the AI reading back, you would need to run Read with AI again.</p>`, 'Delete AI reading', true))) { el.disabled = false; return; }
      await post('/api/requirement-files/forget-reading', { file: el.dataset.file });
      S.reqs = null;
      toast('Back to TraceQA’s automatic reading of this document.', 4000, 'ok');
    } else if (a === 'job-stop') {
      await post(`/api/jobs/${enc(el.dataset.id)}/stop`);
      toast('Stopping…', 3000);
    } else if (a === 'connect') {
      const r = await post('/api/connect-ai-tools');
      $('#connectOut').innerHTML = callout('ok', `Connected. ${r.created.length ? 'Created ' + esc(r.created.join(', ')) + '. ' : ''}${r.updated.length ? 'Updated ' + esc(r.updated.join(', ')) + '.' : ''}`) + `<p class="small muted">Antigravity: open MCP Servers → Manage MCP Servers → View raw config, and add:</p><pre class="code">${esc(r.antigravity)}</pre>`;
      el.disabled = false;
      return;
    }
    if (!$('#dlg').open) render();
  } catch (err) {
    toastError(err);
    el.disabled = false;
  }
});
