});
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-toggle]');
  if (t) { const target = $(t.dataset.toggle); if (target) target.hidden = !t.checked; }
  const p = e.target.closest('[data-provider-switch]');
  if (p) {
    document.querySelectorAll('[data-provider]').forEach((el) => (el.hidden = el.dataset.provider !== p.value));
    if (p.value !== 'anthropic') loadModels(p.value, true);
  }
  if (e.target.id === 'uploadDoc') {
    const file = e.target.files[0];
    e.target.value = '';
    uploadDocument(file).catch(toastError);
  }
  const f = e.target.closest('#main form[data-form="settings"]');
  if (f) { f.dataset.dirty = '1'; const s = $('#saveState'); s.className = 'save-state dirty'; s.innerHTML = `${icon('alert', 16)} You have unsaved changes`; }
});

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  const submits = [...document.querySelectorAll(`[type=submit][form="${f.id}"]`), ...f.querySelectorAll('[type=submit]')];
  submits.forEach((b) => (b.disabled = true));
  try {
    switch (f.dataset.form) {
      case 'setup': {
        const auth = fd.get('hasAuth') ? { loginPath: fd.get('loginPath') || '/login', usernameLabel: fd.get('usernameLabel') || 'Email', passwordLabel: fd.get('passwordLabel') || 'Password', submitButton: fd.get('submitButton') || 'Sign in' } : undefined;
        const env = fd.get('hasAuth') ? { TEST_USER_EMAIL: fd.get('testUser') || '', TEST_USER_PASSWORD: fd.get('testPassword') || '' } : undefined;
        const r = await post('/api/setup', { baseUrl: fd.get('baseUrl'), auth, env, agents: fd.get('agents') === '1' });
        await refreshState();
        location.hash = '#/requirements/files/new';
        toast(`Project set up: ${esc(r.created.join(', '))}.${r.notes.length ? ' ' + esc(r.notes.join(' ')) : ''} Next, add your requirements.`, 9000, 'ok');
        break;
      }
      case 'clarify': {
        const r = await post(`/api/requirements/${enc(f.dataset.req)}/clarify`, { acId: f.dataset.ac, text: fd.get('text') });
        toast(`${esc(f.dataset.req)} ${esc(r.criterion.id)} saved.${r.criterion.issues.length ? ' Still unclear: ' + esc(r.criterion.issues.map((i) => i.message).join(' ')) : ''}`, 6000, r.criterion.issues.length ? 'info' : 'ok');
        break;
      }
      case 'reqfile': {
        const r = await post('/api/requirement-files', { file: fd.get('file'), content: fd.get('content'), previousFile: f.dataset.previous || undefined });
        S.reqs = null;
        delete f.dataset.dirty;
        toast(`Saved ${esc(r.file)}. ${plural(r.imported, 'requirement')} imported${r.mapped ? ' and mapped to pages' : ''}.${r.duplicates.length ? ' Duplicate IDs ignored: ' + esc(r.duplicates.join(', ')) : ''}`, 6000, 'ok');
        if (location.hash !== `#/requirements/files/${enc(r.file)}`) { location.hash = `#/requirements/files/${enc(r.file)}`; return; }
        break;
      }
      case 'agent': {
        const job = await agentTask(String(fd.get('task')).trim());
        if (job) { delete f.dataset.dirty; location.hash = `#/jobs/${enc(job.id)}`; }
        return;
      }
      case 'settings': {
        const num = (k) => Number(fd.get(k));
        const config = {
          baseUrl: fd.get('baseUrl'),
          browsers: fd.getAll('browsers'),
          auth: fd.get('hasAuth') ? { loginPath: fd.get('auth.loginPath'), usernameLabel: fd.get('auth.usernameLabel'), passwordLabel: fd.get('auth.passwordLabel'), submitButton: fd.get('auth.submitButton') } : null,
          safety: { allowedHosts: toList(fd.get('safety.allowedHosts')), blockedActions: toList(fd.get('safety.blockedActions')), maxPagesPerSession: num('safety.maxPagesPerSession'), maxMinutesPerSession: num('safety.maxMinutesPerSession') },
          analyze: { maxPages: num('analyze.maxPages'), skipLinks: toList(fd.get('analyze.skipLinks')) },
          ai: {
            provider: fd.get('ai.provider'),
            model: String(fd.get('ai.model')).trim(),
            effort: fd.get('ai.effort'),
            maxTurns: num('ai.maxTurns'),
            openrouter: {
              model: String(fd.get('ai.openrouter.model')).trim(),
              baseUrl: String(fd.get('ai.openrouter.baseUrl')).trim(),
              dataCollection: fd.get('ai.openrouter.dataCollection'),
              zdr: fd.get('ai.openrouter.zdr') === '1',
            },
            ollama: { model: String(fd.get('ai.ollama.model')).trim(), baseUrl: String(fd.get('ai.ollama.baseUrl')).trim(), contextLength: num('ai.ollama.contextLength') },
            lmstudio: { model: String(fd.get('ai.lmstudio.model')).trim(), baseUrl: String(fd.get('ai.lmstudio.baseUrl')).trim() },
          },
          jira: fd.get('hasJira') ? { baseUrl: fd.get('jira.baseUrl'), projectKey: String(fd.get('jira.projectKey')).trim(), issueType: fd.get('jira.issueType') || 'Bug', auth: fd.get('jira.auth'), labels: toList(fd.get('jira.labels'), /,/), requirementsJql: String(fd.get('jira.requirementsJql') || '').trim() || undefined, acceptanceCriteriaField: String(fd.get('jira.acceptanceCriteriaField') || '').trim() || undefined } : null,
        };
        if (!config.browsers.length) throw new Error('Pick at least one browser.');
        const current = await api('/api/settings');
        if (current.config.auth) Object.assign(config.auth || {}, { usernameEnv: current.config.auth.usernameEnv, passwordEnv: current.config.auth.passwordEnv });
        if (current.config.jira && config.jira) Object.assign(config.jira, { emailEnv: current.config.jira.emailEnv, tokenEnv: current.config.jira.tokenEnv });
        const env = {};
        for (const [k, v] of fd.entries()) {
          if (k.startsWith('env:') && String(v) !== '') env[k.slice(4)] = String(v);
          if (k.startsWith('clear:')) env[k.slice(6)] = null;
        }
        const r = await post('/api/settings', { config, env });
        delete f.dataset.dirty;
        await refreshState();
        toast(`Settings saved.${r.notes.length ? '\n' + r.notes.map(esc).join('\n') : ''}`, 8000, 'ok');
        break;
      }
    }
    render();
  } catch (err) {
    toastError(err);
  } finally {
    submits.forEach((b) => (b.disabled = false));
  }
});

function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('#liveDot').style.background = '#3DD37A'; $('#liveText').textContent = 'Live'; };
  es.onerror = () => { $('#liveDot').style.background = '#D03B3B'; $('#liveText').textContent = 'Reconnecting…'; };
  es.addEventListener('change', () => { refreshState().then(liveRefresh); });
  es.addEventListener('job-log', (ev) => {
    const d = JSON.parse(ev.data);
    const log = $('#joblog');
    if (!log || log.dataset.job !== d.id) return;
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.append((log.textContent ? '\n' : '') + d.line);
    if (atBottom) log.scrollTop = log.scrollHeight;
  });
  // Live progress of an AI job: patch the page in place (no full re-render), and the running pill.
  es.addEventListener('job-progress', (ev) => {
    const d = JSON.parse(ev.data);
    patchProgress(d.id, d.progress);
    const jb = S.jobs.find((x) => x.id === d.id);
    if (jb) {
      const ph = d.progress.phases.find((x) => x.key === d.progress.phase);
      jb.progress = { ...d.progress, events: undefined, phaseLabel: ph ? ph.label : undefined };
      updatePill();
    }
  });
  // A new exploration step: refresh the live screenshot, or the session page being watched.
  let sessionTimer;
  es.addEventListener('session', (ev) => {
    const d = JSON.parse(ev.data);
    clearTimeout(sessionTimer);
    sessionTimer = setTimeout(async () => {
      const [view, id] = route();
      const box = $('#liveShot');
      if (view === 'jobs' && box && S.jobView && S.jobView.sessionId === d.id) {
        const s = (await api(`/api/sessions/${enc(d.id)}`).catch(() => ({}))).session;
        if (s) box.innerHTML = liveShotHtml(s);
      } else if (view === 'sessions' && (!id || id === d.id)) liveRefresh();
    }, 300);
  });
  es.addEventListener('job', (ev) => {
    const j = JSON.parse(ev.data);
    refreshJobs();
    if (j.status === 'done' || j.status === 'failed' || j.status === 'stopped') {
      const [view, id] = route();
      const watching = view === 'jobs' && (!id || id.toUpperCase() === j.id);
      if (!watching) toast(`<b>${esc(j.label)}</b> ${j.status === 'done' ? 'finished' : j.status === 'stopped' ? 'was stopped' : 'failed'}. <a href="#/jobs/${enc(j.id)}">Details</a>`, 8000, j.status === 'done' ? 'ok' : j.status === 'failed' ? 'error' : 'info');
      refreshState().then(liveRefresh);
    } else {
      const [view] = route();
      if (view === 'jobs') liveRefresh();
    }
  });
}

(async () => {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  buildNav();
  // Screenshot viewer: buttons, arrow keys, click outside to close.
  const lb = $('#lightbox');
  const step = (n) => { LB.i = Math.min(LB.items.length - 1, Math.max(0, LB.i + n)); showShot(); };
  $('#lbPrev').onclick = () => step(-1);
  $('#lbNext').onclick = () => step(1);
  $('#lbClose').onclick = () => lb.close();
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  setInterval(tickElapsed, 1000);
  await refreshState();
  window.addEventListener('hashchange', () => render());
  await render();
  refreshJobs();
  connect();
})();
</script>
</body>
